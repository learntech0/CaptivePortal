cat << 'EOF' > /etc/nodogsplash/nodogsplash.conf
GatewayInterface br-lan
GatewayAddress 192.168.0.1
MaxClients 50
CheckInterval 30

# Redirect to the router's own portal page (no query string — see portal.html)
RedirectURL "http://192.168.0.1/portal.html"

FirewallRuleSet preauthenticated {
    # DNS + DHCP so the phone can join the network
    AllowedToRouter tcp port 53
    AllowedToRouter udp port 53
    AllowedToRouter udp port 67
    AllowedToRouter udp port 68

    # Allow the portal page itself (router web server on port 80)
    AllowedToRouter tcp port 80

    # Allow ONLY the Vercel app over HTTPS — nothing else
    FirewallRule allow tcp port 443 to 216.198.79.195
}

FirewallRuleSet authenticated {
    FirewallRule allow all
}
EOF